<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do - Hiba</title>
<style>
body{font-family:Arial;text-align:center;background:#FFFBF2;padding:20px}
.box{background:white;padding:30px;max-width:500px;margin:40px auto;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
input{padding:12px;border-radius:12px;border:1px solid #ddd;width:65%;font-size:16px}
.add{background:#ff6b6b;color:white;border:none;padding:12px 20px;border-radius:12px;margin-left:8px;font-weight:bold}
ul{list-style:none;padding:0;margin-top:20px;text-align:left}
li{background:#FFF1F2;padding:12px 16px;border-radius:12px;margin-top:8px;display:flex;justify-content:space-between}
.del{color:red;cursor:pointer;font-weight:bold}
a{color:#999;text-decoration:none;display:inline-block;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h2>Meine To-Do Liste ✅</h2>
<input id="task" placeholder="Neue Aufgabe...">
<button class="add" onclick="add()">Add</button>
<ul id="list"></ul>
<a href="index.html">← Zurück zur Hauptseite</a>
</div>
<script>
function add(){
let t=document.getElementById('task').value;
if(t=="")return;
let li=document.createElement('li');
li.innerHTML=t+' <span class="del" onclick="this.parentElement.remove()">X</span>';
document.getElementById('list').appendChild(li);
document.getElementById('task').value="";
}
</script>
</body>
</html>
