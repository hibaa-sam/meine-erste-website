<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Projekt 4 - Uhr</title>
<style>
body { background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
#clock { font-size: 60px; border: 3px solid #0f0; padding: 20px; border-radius: 20px; }
</style>
</head>
<body>
<h2>🕐 Meine Uhr - Taza & Berlin</h2>
<div id="clock">00:00:00</div>
<p id="date"></p>
<a href="index.html" style="color:white; margin-top:20px;">← Zurück</a>
<script>
function update(){
 const now = new Date();
 document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE', {timeZone: 'Africa/Casablanca'});
 document.getElementById('date').textContent = now.toLocaleDateString('de-DE');
}
setInterval(update,1000);
update();
</script>
</body>
</html>
